#
# Reusable workflow: post-build smoke test.
#
# Downloads the official DuckDB CLI for the target version, installs the built
# artifact into it, loads it, and calls a real function. This is what a user
# does when installing the extension.
#
# Why it exists: every other job in this pipeline exercises build/release/duckdb
# -- a shell with the extension statically linked in -- which never loads the
# .duckdb_extension file we actually ship. An artifact can build green and still
# fail to instantiate.
#
# Call it AFTER build and BEFORE deploy, so a broken artifact on any platform
# blocks distribution.
#
name: Extension Smoke Test

on:
  workflow_call:
    inputs:
      extension_name:
        required: true
        type: string
      duckdb_version:
        required: true
        type: string
      # ';'-separated, must match the build job so we never try to download an
      # artifact that was never produced.
      exclude_archs:
        required: false
        type: string
        default: ""
      artifact_postfix:
        required: false
        type: string
        default: ""

jobs:
  smoke-test:
    name: Smoke test (${{ matrix.arch }})
    strategy:
      # Run every platform even if one fails, so a single broken arch does not
      # hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - arch: linux_amd64
            runner: ubuntu-24.04
          - arch: osx_arm64
            runner: macos-latest
          - arch: windows_amd64
            runner: windows-latest
    timeout-minutes: 15
    runs-on: ${{ matrix.runner }}
    steps:
      # Skip at step level, not job level: a job-level `if:` is evaluated before
      # the matrix expands, so matrix.arch is not in scope there and the whole
      # workflow fails to validate (zero jobs, no logs, no useful error).
      - name: Check whether this arch is excluded
        id: gate
        shell: bash
        env:
          # Via env, not direct interpolation: exclude_archs is sometimes a
          # GitHub expression whose value contains quotes, which would break
          # the shell if pasted into the script body.
          EXCLUDE_ARCHS: ${{ inputs.exclude_archs }}
          ARCH: ${{ matrix.arch }}
        run: |
          # Exact-token match, never a substring test. Nearly every caller
          # excludes `windows_amd64_mingw`; a substring test also matches
          # `windows_amd64` and would silently skip the real Windows smoke
          # test while still reporting the job green.
          skip=false
          IFS=';, ' read -ra tokens <<< "$EXCLUDE_ARCHS"
          for t in "${tokens[@]}"; do
            if [[ "$t" == "$ARCH" ]]; then skip=true; fi
          done
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          if [[ "$skip" == "true" ]]; then
            echo "$ARCH is excluded by the build job; nothing to smoke test."
          else
            echo "$ARCH will be smoke tested."
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Download extension artifact
        if: steps.gate.outputs.skip != 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.extension_name }}-${{ inputs.duckdb_version }}-extension-${{ matrix.arch }}${{ inputs.artifact_postfix }}
          path: ./extension_artifact

      - name: Smoke test (Linux / macOS)
        if: steps.gate.outputs.skip != 'true' && runner.os != 'Windows'
        run: |
          python3 scripts/smoke_test.py \
            "$(pwd)/extension_artifact/${{ inputs.extension_name }}.duckdb_extension" \
            "${{ inputs.duckdb_version }}" \
            "${{ matrix.arch }}"

      - name: Smoke test (Windows)
        if: steps.gate.outputs.skip != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ext = Join-Path $PWD "extension_artifact\${{ inputs.extension_name }}.duckdb_extension"
          python scripts/smoke_test.py "$ext" "${{ inputs.duckdb_version }}" "${{ matrix.arch }}"

      # How much of this extension documents itself, as an agent querying
      # duckdb_functions() would see it. REPORT-ONLY: always exits 0 and never
      # fails the build.
      #
      # linux_amd64 only -- the answer is a property of the source, not the
      # platform, so running it on all three would print the same table three
      # times. Written to the job summary rather than the log, because a report
      # nobody opens is a report that does not exist.
      - name: Function documentation audit
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'linux_amd64'
        shell: bash
        run: |
          # actions/checkout does not fetch submodules, so datazoo-banner (which
          # holds the audit script) is an empty directory here. Init just that one
          # rather than `submodules: recursive`, which would also clone duckdb --
          # a large checkout this job has no other use for.
          #
          # No --depth 1: a shallow fetch can only serve objects that are ref tips,
          # and the pinned commit stops being one as soon as its branch is merged
          # ("Server does not allow request for unadvertised object"). The banner
          # repo is a handful of headers and scripts, so a full clone is cheap.
          git submodule update --init datazoo-banner
          # v1.x ships duckdb_cli-linux-amd64.zip, v2.0 duckdb-cli-linux-amd64.tar.gz
          base="https://github.com/duckdb/duckdb/releases/download/${{ inputs.duckdb_version }}"
          mkdir -p /tmp/duckdb_cli
          if curl -fsSL -o /tmp/duckdb_cli.zip "$base/duckdb_cli-linux-amd64.zip"; then
            unzip -o -q /tmp/duckdb_cli.zip -d /tmp/duckdb_cli
          else
            curl -fsSL "$base/duckdb-cli-linux-amd64.tar.gz" | tar -xz -C /tmp/duckdb_cli
          fi
          datazoo-banner/audit-function-docs.sh \
            --extension "${{ inputs.extension_name }}" \
            --artifact "./extension_artifact/${{ inputs.extension_name }}.duckdb_extension" \
            --duckdb /tmp/duckdb_cli/duckdb \
            --preload vss \
            --check-examples >> "$GITHUB_STEP_SUMMARY"

      # The AAS the extension writes must validate against the official AAS v3.2 JSON
      # schema (GitHub #34, review AAS-3). A functional test, not a format check: it runs
      # the writer in a stock DuckDB CLI with the release artifact loaded and fails the
      # job on a schema violation. linux_amd64 only, like the audit above, whose CLI it uses.
      - name: AAS output validates against the AAS JSON schema
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'linux_amd64'
        shell: bash
        env:
          DUCKDB: /tmp/duckdb_cli/duckdb
          ANOFOX_EXTENSION: ${{ github.workspace }}/extension_artifact/${{ inputs.extension_name }}.duckdb_extension
          REQUIRE_SHELL: '1'
        run: |
          python -m pip install --quiet pytest jsonschema
          python -m pytest scripts/tests/test_aas_schema.py scripts/tests/test_check_doc_snippets.py -q -p no:cacheprovider

      # The docs and the Claude Code skills (plugins/anofox-similarity) against the release
      # artifact: every SQL example in README.md and the skills runs, every registered function
      # is on an API page and named in a skill, and the generated API reference is current.
      # A functional check, not a format check. linux_amd64 only, using the audit step's CLI.
      - name: Docs and Claude Code skills run against the artifact
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'linux_amd64'
        shell: bash
        env:
          DUCKDB: /tmp/duckdb_cli/duckdb
          DUCKDB_BASELINE: /tmp/duckdb_cli/duckdb
          ANOFOX_EXTENSION: ${{ github.workspace }}/extension_artifact/${{ inputs.extension_name }}.duckdb_extension
          DATAZOO_DISABLE_TELEMETRY: '1'
        run: |
          # The extension installs vss on LOAD when it is missing; do it once here, not per block.
          "$DUCKDB" -c "INSTALL vss;"
          python3 scripts/generate_api_reference.py --check
          python3 scripts/check_doc_snippets.py --out "$RUNNER_TEMP/doc-snippets.tsv" || {
            grep -P '^(FAIL|STALE)\t' "$RUNNER_TEMP/doc-snippets.tsv"; exit 1; }

      # Transactional embeddings need the community anofox_forecast extension, which the unit tests
      # cannot install. This runs the whole pipeline (statistics refresh, embeddings, checks on
      # dimensions, NaN, the ERP positions) against the artifact and the current community build.
      # When anofox_forecast is not published for this DuckDB version yet (the repository answers
      # HTTP 404), say so and skip, on tags too (a release must not wait for another extension);
      # any other INSTALL error (network, server) fails, and so does a 404 on v1.5.6, where it is
      # published.
      - name: Transactional embeddings with the community anofox_forecast
        if: steps.gate.outputs.skip != 'true' && matrix.arch == 'linux_amd64'
        shell: bash
        env:
          DUCKDB: /tmp/duckdb_cli/duckdb
          ANOFOX_EXTENSION: ${{ github.workspace }}/extension_artifact/${{ inputs.extension_name }}.duckdb_extension
          DATAZOO_DISABLE_TELEMETRY: '1'
          DUCKDB_VERSION: ${{ inputs.duckdb_version }}
        run: |
          if ! "$DUCKDB" -c "INSTALL anofox_forecast FROM community;" >"$RUNNER_TEMP/fcst.err" 2>&1; then
            cat "$RUNNER_TEMP/fcst.err"
            if grep -q '(HTTP 404)' "$RUNNER_TEMP/fcst.err" && [[ "$DUCKDB_VERSION" != v1.5.6 ]]; then
              echo "::notice::anofox_forecast is not published on community for DuckDB $DUCKDB_VERSION (HTTP 404); skipped"
              exit 0
            fi
            echo "::error::INSTALL anofox_forecast FROM community failed"
            exit 1
          fi
          "$DUCKDB" -unsigned -cmd "LOAD '$ANOFOX_EXTENSION'" < scripts/smoke_transactional.sql
